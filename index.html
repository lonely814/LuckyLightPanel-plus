<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="轻面板 - 简洁美观的个人面板页">
  <meta name="theme-color" content="#667eea">
  
  <!-- 防追踪设置 -->
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Referrer-Policy" content="no-referrer">
  <meta http-equiv="X-DNS-Prefetch-Control" content="off">
  <meta name="format-detection" content="telephone=no, email=no, address=no">
  
  <title>轻面板</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <!-- 液态玻璃折射滤镜，全站只定义一次。
       Chromium 可把 filter: url(#glass-distortion) 作用到 backdrop 采样结果；
       Firefox/Safari 不支持时由 _glass.css 的 @supports 回退到纯 blur。 -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.025 0.025" numOctaves="2" seed="92" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
        <feDisplacementMap in="SourceGraphic" in2="blurred" scale="65" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>
  <!-- FontAwesome（非阻塞加载：不拖慢首屏，加载完成后自动生效） -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
